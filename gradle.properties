#Sat Mar 12 05:53:50 MSK 2016
APP_VERSION_CODE=6976
APP_VERSION_NAME=12.9.0.10
APP_PACKAGE=org.telegram.messenger.prime
IS_PRIVATE=false
# PrimeGram's own credentials are NOT here: this file is in the repository.
#
# Telegram forbids publishing an api_hash, and the penalty falls on the id rather than on whoever
# abused it - a scraped credential used for spam gets the id banned, and every installed copy of
# the app stops connecting. So the real values live in local.properties, which is gitignored, and
# in the CI secrets. The public pair below is Telegram Web's, and it is what an unconfigured
# checkout builds with, so cloning the repository still produces a working app.
APP_ID=2496
APP_HASH=8da85b0d5bfe62527e5b244c209159c3
RELEASE_KEY_PASSWORD=android
RELEASE_KEY_ALIAS=androidkey
RELEASE_STORE_PASSWORD=android
org.gradle.jvmargs=-Xmx4096M
org.gradle.daemon=true
org.gradle.parallel=false
android.experimental.sdk.cmake.maxJobs=2
org.gradle.configureondemand=false
android.useAndroidX=true
android.enableJetifier=true
android.defaults.buildfeatures.buildconfig=true
android.nonTransitiveRClass=false
android.nonFinalResIds=false
android.enableR8.fullMode=true
# Works around a D8/AGP dexing-transform bug: per-artifact dexing of AARs containing
# Java Records (e.g. amneziawg-android) fails with "Attempt to create a global synthetic
# for 'Record desugaring' without a global-synthetics consumer" because the per-artifact
# transform pathway lacks a full classpath. Using the full classpath for dexing avoids it.
android.useFullClasspathForDexingTransform=true
