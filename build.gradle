// Top-level build file where you can add configuration options common to all sub-projects/modules.
buildscript {
    repositories {
        mavenCentral()
        google()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.13.2'
        classpath 'com.google.gms:google-services:4.4.2'
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:1.9.20"
        // PrimeGram: the plugin engine. Chaquopy may be applied to exactly one module per app, so
        // it is applied to TMessagesProj — the engine and the Python SDK live beside the rest of
        // the client, and every app module inherits them without being told about Python at all.
        classpath 'com.chaquo.python:gradle:16.1.0'
    }
}
repositories {
    google()
}

// PrimeGram: every existing module already declares its own repositories block, but the
// dynamically-included ':flutter' project (settings.gradle's include_flutter.groovy) is a
// generated file we don't hand-edit and ships with none of its own - without this, its
// classpath (androidx.lifecycle/fragment/core/etc., transitive deps of
// io.flutter:flutter_embedding_release) fails to resolve. allprojects here reaches it the
// same way it would any other subproject that forgot its own repositories block.
allprojects {
    repositories {
        google()
        mavenCentral()
    }
}
