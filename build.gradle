// Top-level build file where you can add configuration options common to all sub-projects/modules.
buildscript {
    repositories {
        mavenCentral()
        google()
        maven { url 'https://developer.huawei.com/repo/' }
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.13.2'
        classpath 'com.google.gms:google-services:4.4.2'
        classpath 'com.huawei.agconnect:agcp:1.9.1.301'
        classpath 'com.google.firebase:firebase-crashlytics-gradle:3.0.1'
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:1.9.20"
        // PrimeGram: the plugin engine. Chaquopy may be applied to exactly one module per app, so
        // it is applied to TMessagesProj — the engine and the Python SDK live beside the rest of
        // the client, and every app module inherits them without being told about Python at all.
        classpath 'com.chaquo.python:gradle:16.1.0'
    }
}
repositories {
    google()
}
