name: Compile PrimeGram Release APK

on:
  push:
    branches:
      - release
  workflow_dispatch:

jobs:
  build:
    name: Build Standalone Release APK
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'microsoft'

      - name: Install Android NDK
        run: |
          echo "Installing NDK version 27.2.12479018..."
          ${ANDROID_SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager --install "ndk;27.2.12479018"

      - name: Setup Gradle Cache
        uses: gradle/actions/setup-gradle@v3

      - name: Grant Execute Permission to Gradlew
        run: chmod +x gradlew

      - name: Compile Standalone Release APK
        run: ./gradlew :TMessagesProj_AppStandalone:assembleAfatRelease --no-daemon

      - name: Upload Compiled APK
        uses: actions/upload-artifact@v4
        with:
          name: PrimeGram-Release-APK
          path: TMessagesProj_AppStandalone/build/outputs/apk/afat/release/*.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Latest Release
          files: TMessagesProj_AppStandalone/build/outputs/apk/afat/release/*.apk
