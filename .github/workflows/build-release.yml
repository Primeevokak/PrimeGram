name: Compile PrimeGram Release APK

on:
  push:
    branches:
      - release
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    name: Build Standalone Release APK
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'microsoft'

      # Chaquopy compiles the plugin SDK with a local interpreter, and it must be the same
      # major.minor the app embeds. The runner's own python3 is a different version, so pinning
      # this is what keeps the build from depending on what Ubuntu happens to ship today.
      - name: Set up Python 3.11 for Chaquopy
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Android NDK
        run: |
          echo "Installing NDK version 27.2.12479018..."
          ${ANDROID_SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager --install "ndk;27.2.12479018"
          # build-tools give us zipalign/apksigner for the Chaquopy asset-stripping step below -
          # pinned to the same version the app module builds against (buildToolsVersion in
          # TMessagesProj_AppStandalone/build.gradle) so zipalign's format matches what AGP itself uses.
          ${ANDROID_SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager --install "build-tools;35.0.0"

      - name: Setup Gradle Cache
        uses: gradle/actions/setup-gradle@v3

      - name: Grant Execute Permission to Gradlew
        run: chmod +x gradlew

      - name: Compile Standalone Release APK
        # The credentials come from the repository's secrets, never from a tracked file. Without
        # them the build still succeeds - it falls back to the public pair - so a fork of the fork
        # is not blocked, it just connects as somebody else.
        env:
          PRIME_APP_ID: ${{ secrets.PRIME_APP_ID }}
          PRIME_APP_HASH: ${{ secrets.PRIME_APP_HASH }}
        run: ./gradlew :TMessagesProj_AppStandalone:assembleAfatRelease --no-daemon

      - name: Rename APKs
        run: |
          cd TMessagesProj_AppStandalone/build/outputs/apk/afat/release/
          for file in *.apk; do
            if [[ "$file" == *"arm64-v8a"* ]]; then
              mv "$file" "../../../../../../PrimeGram-arm64-v8a.apk"
            elif [[ "$file" == *"armeabi-v7a"* ]]; then
              mv "$file" "../../../../../../PrimeGram-armeabi-v7a.apk"
            elif [[ "$file" == *"x86_64"* ]]; then
              mv "$file" "../../../../../../PrimeGram-x86_64.apk"
            elif [[ "$file" == *"x86"* ]]; then
              mv "$file" "../../../../../../PrimeGram-x86.apk"
            else
              mv "$file" "../../../../../../PrimeGram.apk"
            fi
          done

      - name: Strip foreign-architecture Python bundles from each split APK
        # Chaquopy bundles the plugin SDK's compiled Python packages (pyyaml, zstandard, lz4,
        # psutil - all with native extensions) as assets/chaquopy/{requirements,stdlib}-<abi>.imy.
        # android.splits.abi only filters lib/<abi>/*.so - it has no idea assets/ exists, so every
        # one of the four split APKs above ships all four architectures' Python bundles even though
        # a device only ever loads the one matching its own ABI. Measured on v12.9.0.6: ~79 MB of
        # dead weight per APK (out of a ~285 MB download), all four other-ABI requirements/stdlib
        # .imy files never touched at runtime. Deleting them post-build is the surgical fix -
        # restructuring Chaquopy into one Gradle product flavor per ABI would be the "clean" way to
        # never build them in the first place, but that means duplicating the flavor dimension
        # across both this module and the TMessagesProj library module for a byte-count problem.
        #
        # Deleting files from an already-signed v2/v3-signed APK invalidates its signature (the
        # signing block covers the whole zip), so each apk has to be re-aligned and re-signed
        # afterwards - same keystore/credentials Gradle itself used to sign it the first time.
        run: |
          BUILD_TOOLS="${ANDROID_SDK_ROOT}/build-tools/35.0.0"
          ALL_ABIS=("armeabi-v7a" "arm64-v8a" "x86" "x86_64")
          KEY_ALIAS=$(grep '^RELEASE_KEY_ALIAS=' gradle.properties | cut -d= -f2)
          KEY_PASSWORD=$(grep '^RELEASE_KEY_PASSWORD=' gradle.properties | cut -d= -f2)
          STORE_PASSWORD=$(grep '^RELEASE_STORE_PASSWORD=' gradle.properties | cut -d= -f2)

          for apk in PrimeGram-*.apk; do
            abi=""
            for a in "${ALL_ABIS[@]}"; do
              if [[ "$apk" == *"$a"* ]]; then
                abi="$a"
                break
              fi
            done
            if [ -z "$abi" ]; then
              echo "Skipping $apk: filename doesn't name an ABI, can't tell which Python bundle to keep."
              continue
            fi

            echo "=== $apk: keeping only the $abi Python bundle ==="
            for other in "${ALL_ABIS[@]}"; do
              if [ "$other" != "$abi" ]; then
                zip -q -d "$apk" \
                  "assets/chaquopy/requirements-${other}.imy" \
                  "assets/chaquopy/stdlib-${other}.imy" \
                  "assets/chaquopy/bootstrap-native/${other}/*" \
                  2>/dev/null || true
              fi
            done

            "${BUILD_TOOLS}/zipalign" -f -p 4 "$apk" "${apk}.aligned"
            mv "${apk}.aligned" "$apk"
            "${BUILD_TOOLS}/apksigner" sign \
              --ks TMessagesProj/config/release.keystore \
              --ks-key-alias "$KEY_ALIAS" \
              --ks-pass "pass:$STORE_PASSWORD" \
              --key-pass "pass:$KEY_PASSWORD" \
              "$apk"
            echo "New size: $(du -h "$apk" | cut -f1)"
          done

      - name: Upload Compiled APKs (Artifact)
        uses: actions/upload-artifact@v4
        with:
          name: PrimeGram-Release-APKs
          path: PrimeGram*.apk

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: PrimeGram*.apk
          name: PrimeGram ${{ github.ref_name }}
          body: "Автоматическая сборка релиза ${{ github.ref_name }}"
          draft: false
          prerelease: false

      # A tag build checks out that tag, detached - not the release branch GitHub Pages
      # serves docs/ from. Editing it in place would edit a commit nothing deploys, so this
      # fetches the actual release branch first and commits there instead.
      - name: Update displayed version on the site
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          git fetch origin release
          git checkout release
          sed -i "s/версия [0-9]\+\.[0-9]\+\.[0-9]\+\.[0-9]\+/версия ${VERSION}/" docs/index.html
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/index.html
          if ! git diff --cached --quiet; then
            git commit -m "docs: bump displayed version to ${VERSION}"
            git push origin release
          fi
