import org.gradle.nativeplatform.platform.internal.DefaultNativePlatform

apply plugin: 'com.android.library'
apply plugin: 'com.chaquo.python'

repositories {
    mavenCentral()
    google()
    // PrimeGram: AliuHook, the in-process method hooking used by the plugin engine. Published
    // only here - it is not on Maven Central.
    maven { url 'https://maven.aliucord.com/releases' }
}

configurations {
    compile.exclude module: 'support-v4'
}

configurations.all {
    exclude group: 'com.google.firebase', module: 'firebase-core'
    exclude group: 'androidx.recyclerview', module: 'recyclerview'
}

dependencies {
    implementation 'vpn:sdk'
    implementation 'androidx.core:core:1.16.0'
    implementation 'androidx.palette:palette:1.0.0'
    implementation 'androidx.exifinterface:exifinterface:1.3.6'
    implementation 'androidx.dynamicanimation:dynamicanimation:1.0.0'
    implementation "androidx.sharetarget:sharetarget:1.2.0"
    implementation 'androidx.interpolator:interpolator:1.0.0'
    implementation 'androidx.biometric:biometric:1.1.0'
    // PrimeGram: ProxyController, the only supported way to point WebView at a proxy.
    implementation 'androidx.webkit:webkit:1.12.1'

    implementation 'com.google.android.gms:play-services-cast-framework:21.4.0'
    implementation "androidx.mediarouter:mediarouter:1.7.0"

    implementation 'androidx.car.app:app:1.4.0'
    implementation 'androidx.car.app:app-projected:1.4.0'
    implementation 'org.nanohttpd:nanohttpd:2.3.1'

    compileOnly 'org.checkerframework:checker-qual:2.5.2'
    compileOnly 'org.checkerframework:checker-compat-qual:2.5.0'
    // PrimeGram: method hooking for plugins, on LSPlant. Gives the real de.robv.android.xposed
    // API, which is what exteraGram plugins import - so a plugin written against hook_method
    // there works here without knowing anything changed. Supports Android 5 through 15 on all
    // four ABIs; where it cannot initialise, hooking is simply unavailable and the rest of the
    // client is untouched.
    implementation 'com.aliucord:Aliuhook:1.1.4'
    // PrimeGram: MVEL for HookFilter.Condition() - the same engine exteraGram itself evaluates
    // plugin condition expressions with, so a condition string a plugin author wrote for
    // exteraGram means the same thing here.
    implementation 'org.mvel:mvel2:2.5.2.Final'
    // PrimeGram: runtime DEX generation for ClassBuilder - a plugin subclassing an app class from
    // Python needs an actual Java class to exist, which Chaquopy alone cannot produce. Same
    // package (com.android.dx) exteraGram's own class generator builds on.
    implementation 'com.linkedin.dexmaker:dexmaker:2.28.6'
    implementation 'com.google.firebase:firebase-messaging:22.0.0'
    implementation 'com.google.firebase:firebase-config:21.0.1'
    implementation 'com.google.firebase:firebase-datatransport:18.1.0'
    implementation 'com.google.firebase:firebase-appindexing:20.0.0'
    implementation 'com.google.android.gms:play-services-maps:18.1.0'
    implementation 'com.google.android.gms:play-services-auth:20.4.0'
    implementation 'com.google.android.gms:play-services-vision:20.1.3'
    implementation 'com.google.android.gms:play-services-wearable:18.0.0'
    implementation 'com.google.android.gms:play-services-location:21.0.1'
    implementation 'com.google.android.gms:play-services-wallet:19.1.0'
    implementation 'com.googlecode.mp4parser:isoparser:1.0.6'
    implementation 'com.stripe:stripe-android:2.0.2'
    implementation 'com.google.mlkit:language-id:17.0.6'
    implementation 'com.android.billingclient:billing:7.1.1'
    implementation 'com.google.code.gson:gson:2.11.0'
    implementation 'com.google.guava:guava:31.1-android'
    implementation 'com.google.android.play:integrity:1.3.0'
    implementation 'com.google.android.gms:play-services-safetynet:18.0.1'

    implementation 'com.google.android.gms:play-services-mlkit-subject-segmentation:16.0.0-beta1'
    implementation 'com.google.android.gms:play-services-mlkit-image-labeling:16.0.8'

    implementation "androidx.credentials:credentials:1.6.0-alpha04"
    implementation "androidx.credentials:credentials-play-services-auth:1.6.0-alpha04"

    implementation "io.noties.markwon:core:4.6.2"
    implementation "io.noties.markwon:ext-strikethrough:4.6.2"
    implementation "io.noties.markwon:ext-tables:4.6.2"
    implementation "io.noties.markwon:html:4.6.2"
    implementation "io.noties.markwon:inline-parser:4.6.2"
    implementation "io.noties.markwon:ext-latex:4.6.2"

//    implementation 'com.google.mlkit:translate:17.0.3'

    constraints {
        implementation("org.jetbrains.kotlin:kotlin-stdlib-jdk7:1.8.0") {
            because("kotlin-stdlib-jdk7 is now a part of kotlin-stdlib")
        }
        implementation("org.jetbrains.kotlin:kotlin-stdlib-jdk8:1.8.0") {
            because("kotlin-stdlib-jdk8 is now a part of kotlin-stdlib")
        }
    }
    implementation 'com.google.android.recaptcha:recaptcha:18.7.1'

    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.5'
}

def isWindows = String.valueOf(DefaultNativePlatform.currentOperatingSystem.toFamilyName() == OperatingSystemFamily.WINDOWS)
android {
    compileSdkVersion 36
    buildToolsVersion '35.0.0'
    ndkVersion "27.2.12479018"

    sourceSets.main.jniLibs.srcDirs = ['./jni/']

    externalNativeBuild {
        cmake {
            path 'jni/CMakeLists.txt'
        }
    }

    lintOptions {
        disable 'MissingTranslation'
        disable 'ExtraTranslation'
        disable 'BlockedPrivateApi'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8

        coreLibraryDesugaringEnabled true
    }


    defaultConfig {
        minSdkVersion 24
        targetSdkVersion 35

        vectorDrawables.generatedDensities = ['mdpi', 'hdpi', 'xhdpi', 'xxhdpi']

        multiDexEnabled true

        // PrimeGram's own api_id and api_hash, taken from wherever they are configured and never
        // from a tracked file. Order: an environment variable (that is how CI supplies them, out
        // of the repository's secrets), then local.properties (gitignored, for this machine),
        // then the public pair in gradle.properties so an unconfigured checkout still builds.
        //
        // They cannot be secret in the finished app - a client has to carry them to connect, and
        // anyone can read them out of the APK. Keeping them out of the repository is about
        // something narrower: a credential scraped from public source and used for spam gets the
        // id banned, and that stops every installed copy from connecting.
        buildConfigField "int", "APP_ID", primeApiId()
        buildConfigField "String", "APP_HASH", "\"" + primeApiHash() + "\""

        // PrimeGram: the Python runtime plugins execute in.
        //
        // 3.11 and not something newer, on purpose. It is what exteraGram ships, so the compiled
        // wheels plugins pull from PIP are built for this ABI, and it is the last version Chaquopy
        // still offers for 32-bit devices — 3.12 and up are 64-bit only, which would quietly drop
        // armeabi-v7a from the CI splits.
        // buildPython is left to Chaquopy's own search (the py launcher on Windows) so the build
        // does not carry one machine's paths; override it in local.properties if that ever fails.
        python {
            version "3.11"

            // What plugins can import.
            //
            // Two mechanisms, split by one hard line. Packages with **native code** ship a
            // compiled .so per ABI, and Android will not load one from a directory the app can
            // write to - so they can only come from the APK, and only from Chaquopy's own Android
            // build of them. Everything listed here that is marked "native" is therefore the only
            // way a plugin will ever see it. Pure-Python packages have no such limit: see
            // _prime_pip.py, which fetches them from PyPI on demand at run time.
            //
            // So the rule for this list is: bundle everything native that is worth its size, and
            // bundle the handful of pure-Python packages so common that a plugin using one should
            // work with no network at all. exteraGram bundles seven packages in total and cannot
            // install native ones at all; this is deliberately a much wider floor.
            pip {
                // ── Pure Python, bundled because they are near-universal ──────────────────
                install "requests"
                install "httpx"
                install "beautifulsoup4"
                install "python-dateutil"
                install "packaging"

                // ── Native: parsing ───────────────────────────────────────────────────────
                install "lxml"
                install "regex"

                // ── Native: networking ────────────────────────────────────────────────────
                install "aiohttp"
                install "brotli"

                // ── Native: images ────────────────────────────────────────────────────────
                install "pillow"
                install "pyzbar"

                // ── Native: crypto ────────────────────────────────────────────────────────
                install "cryptography"
                install "pycryptodome"
                install "pynacl"
                install "bcrypt"
                install "tgcrypto"

                // ── Everything below is pinned, and the pins are not cosmetic ─────────────
                //
                // Chaquopy resolves against its own Android repository first and PyPI second. When
                // its newest Android build of a package is older than the newest release on PyPI,
                // an unpinned request resolves to the PyPI *source* release - and pip then tries to
                // compile a native extension on the build machine, which fails on Windows and would
                // produce a desktop binary anywhere else. So every package whose Android build has
                // stopped moving is pinned to the last version that exists for Python 3.11.
                //
                // To check one: https://chaquo.com/pypi-13.1/<name>/ and look for a cp311 tag.

                // ── Native: audio ─────────────────────────────────────────────────────────
                // Voice messages and round videos are the media this app is mostly made of, and
                // none of it is reachable from Python without a decoder.
                install "miniaudio==1.59"
                install "soxr==0.3.7"
                install "lameenc==1.7.0"

                // ── Native: charts ────────────────────────────────────────────────────────
                // A plugin that computes something usually wants to show it, and the only way to
                // show anything in a chat is to send a picture of it. matplotlib's own native
                // dependencies are pinned too, for the same reason it is.
                install "matplotlib==3.6.0"
                install "contourpy==1.0.5"
                install "kiwisolver==1.4.5"

                // ── Native: tables ────────────────────────────────────────────────────────
                install "pandas==2.1.3"

                // ── Native: analysis and odds and ends ────────────────────────────────────
                install "pywavelets==1.4.1"
                install "ephem==3.7.7.0"
                install "wordcloud==1.9.2"
                install "editdistance==0.6.2"
                install "bitarray==2.8.2"
                install "lru-dict==1.1.8"
                install "cytoolz==0.12.2"
                install "netifaces==0.10.9"

                // ── Native, but here to unblock pure-Python packages ──────────────────────
                // Dependencies of libraries that look installable at run time and are not: jinja2
                // needs markupsafe, sqlalchemy's async mode needs greenlet, and both are compiled.
                // Bundling the small native half makes the large pure half work through the
                // downloader in _prime_pip.py.
                install "markupsafe==3.0.3"
                install "greenlet==3.0.1"
                install "argon2-cffi==20.1.0"

                // ── Native: data and speed ────────────────────────────────────────────────
                install "numpy"
                install "pyyaml"
                install "zstandard"
                install "lz4"
                install "psutil"

                // ── Deliberately absent, all for one reason ───────────────────────────────
                //
                // Chaquopy's Android builds of these stop at Python 3.10 or 3.8, so on 3.11 they
                // cannot be installed at any version: scipy, opencv-python(-headless),
                // tflite-runtime, ujson, soundfile, coincurve, ta-lib, shapely, marisa-trie.
                //
                // Staying on 3.11 is the trade: plugins written for exteraGram target it, and
                // running those unchanged is the point of this whole feature. Getting these back
                // means building the wheels ourselves with Chaquopy's build-wheel tool, which needs
                // a Linux machine - see the notes in the plugins documentation.
            }
        }

        ndk {
            // The interpreter is native code, so the ABIs it is built for have to be named. Naming
            // all four unconditionally also made CMake build all four, which is minutes of C++ per
            // build on a machine that only ever installs arm64 — so this follows the same CI switch
            // the app module uses.
            if (System.getenv("CI") == "true") {
                abiFilters "armeabi-v7a", "arm64-v8a", "x86", "x86_64"
            } else {
                abiFilters "arm64-v8a"
            }
        }

        externalNativeBuild {
            cmake {
                version '3.10.2'
                arguments '-DANDROID_STL=c++_static', '-DANDROID_PLATFORM=android-21' //, '-DANDROID_SUPPORT_FLEXIBLE_PAGE_SIZES=ON'
            }
        }
    }

    buildTypes {
        debug {
            jniDebuggable true
            minifyEnabled false
            shrinkResources false
            multiDexEnabled true
            proguardFiles getDefaultProguardFile('proguard-android.txt'), '../TMessagesProj/proguard-rules.pro', '../TMessagesProj/proguard-rules-beta.pro'
            ndk.debugSymbolLevel = 'FULL'
            buildConfigField "String", "BUILD_VERSION_STRING", "\"" + APP_VERSION_NAME + "\""
            buildConfigField "String", "APP_CENTER_HASH", "\"\""
            buildConfigField "String", "BETA_URL", "\"" + getProps("BETA_PRIVATE_URL") + "\""
            buildConfigField "boolean", "DEBUG_VERSION", "true"
            buildConfigField "boolean", "DEBUG_PRIVATE_VERSION", "true"
            buildConfigField "boolean", "BUNDLE", "false"
            buildConfigField "boolean", "BUILD_HOST_IS_WINDOWS", isWindows
            buildConfigField "int", "VERSION_NUM", "0"
        }

        HA_private {
            jniDebuggable false
            minifyEnabled true
            multiDexEnabled true
            proguardFiles getDefaultProguardFile('proguard-android.txt'), '../TMessagesProj/proguard-rules.pro', '../TMessagesProj/proguard-rules-beta.pro'
            ndk.debugSymbolLevel = 'FULL'
            buildConfigField "String", "BUILD_VERSION_STRING", "\"" + APP_VERSION_NAME + "\""
            buildConfigField "String", "APP_CENTER_HASH", "\"" + getProps("APP_CENTER_HASH_PRIVATE") + "\""
            buildConfigField "String", "BETA_URL", "\"" + getProps("BETA_PRIVATE_URL") + "\""
            buildConfigField "boolean", "DEBUG_VERSION", "true"
            buildConfigField "boolean", "DEBUG_PRIVATE_VERSION", "true"
            buildConfigField "boolean", "BUNDLE", "false"
            buildConfigField "boolean", "BUILD_HOST_IS_WINDOWS", isWindows
            buildConfigField "int", "VERSION_NUM", "1"
        }

        HA_public {
            jniDebuggable false
            minifyEnabled true
            multiDexEnabled true
            proguardFiles getDefaultProguardFile('proguard-android.txt'), '../TMessagesProj/proguard-rules.pro', '../TMessagesProj/proguard-rules-beta.pro'
            ndk.debugSymbolLevel = 'FULL'
            buildConfigField "String", "BUILD_VERSION_STRING", "\"" + APP_VERSION_NAME + "\""
            buildConfigField "String", "APP_CENTER_HASH", "\"" + getProps("APP_CENTER_HASH_PUBLIC") + "\""
            buildConfigField "String", "BETA_URL", "\"" + getProps("BETA_PUBLIC_URL") + "\""
            buildConfigField "boolean", "DEBUG_VERSION", "true"
            buildConfigField "boolean", "DEBUG_PRIVATE_VERSION", "false"
            buildConfigField "boolean", "BUNDLE", "false"
            buildConfigField "boolean", "BUILD_HOST_IS_WINDOWS", isWindows
            buildConfigField "int", "VERSION_NUM", "4"
        }

        HA_hardcore {
            jniDebuggable false
            minifyEnabled true
            multiDexEnabled true
            proguardFiles getDefaultProguardFile('proguard-android.txt'), '../TMessagesProj/proguard-rules.pro', '../TMessagesProj/proguard-rules-beta.pro'
            ndk.debugSymbolLevel = 'FULL'
            buildConfigField "String", "BUILD_VERSION_STRING", "\"" + APP_VERSION_NAME + "\""
            buildConfigField "String", "APP_CENTER_HASH", "\"" + getProps("APP_CENTER_HASH_HARDCORE") + "\""
            buildConfigField "String", "BETA_URL", "\"" + getProps("BETA_HARDCORE_URL") + "\""
            buildConfigField "boolean", "DEBUG_VERSION", "true"
            buildConfigField "boolean", "DEBUG_PRIVATE_VERSION", "true"
            buildConfigField "boolean", "BUNDLE", "false"
            buildConfigField "boolean", "BUILD_HOST_IS_WINDOWS", isWindows
            buildConfigField "int", "VERSION_NUM", "5"
        }

        standalone {
            jniDebuggable false
            minifyEnabled true
            multiDexEnabled true
            proguardFiles getDefaultProguardFile('proguard-android.txt'), '../TMessagesProj/proguard-rules.pro'
            ndk.debugSymbolLevel = 'FULL'
            buildConfigField "String", "BUILD_VERSION_STRING", "\"" + APP_VERSION_NAME + "\""
            buildConfigField "String", "APP_CENTER_HASH", "\"\""
            buildConfigField "String", "BETA_URL", "\"\""
            buildConfigField "boolean", "DEBUG_VERSION", "false"
            buildConfigField "boolean", "DEBUG_PRIVATE_VERSION", "false"
            buildConfigField "boolean", "BUNDLE", "false"
            buildConfigField "boolean", "BUILD_HOST_IS_WINDOWS", isWindows
            buildConfigField "int", "VERSION_NUM", "6"
        }

        release {
            jniDebuggable false
            minifyEnabled true
            shrinkResources false
            multiDexEnabled true
            proguardFiles getDefaultProguardFile('proguard-android.txt'), '../TMessagesProj/proguard-rules.pro'
            ndk.debugSymbolLevel = 'FULL'
            buildConfigField "String", "BUILD_VERSION_STRING", "\"" + APP_VERSION_NAME + "\""
            buildConfigField "String", "APP_CENTER_HASH", "\"\""
            buildConfigField "String", "BETA_URL", "\"\""
            buildConfigField "boolean", "DEBUG_VERSION", "true"
            buildConfigField "boolean", "DEBUG_PRIVATE_VERSION", "false"
            buildConfigField "boolean", "BUNDLE", "false"
            buildConfigField "boolean", "BUILD_HOST_IS_WINDOWS", isWindows
            buildConfigField "int", "VERSION_NUM", "7"
        }
    }

    namespace 'org.telegram.messenger'
}


/** api_id, from the environment, then local.properties, then the public fallback. */
def primeApiId() {
    def fromEnv = System.getenv("PRIME_APP_ID")
    if (fromEnv != null && !fromEnv.trim().isEmpty()) {
        return fromEnv.trim()
    }
    def fromLocal = getProps("PRIME_APP_ID")
    if (fromLocal != null && !fromLocal.toString().trim().isEmpty()) {
        return fromLocal.toString().trim()
    }
    return APP_ID
}

def primeApiHash() {
    def fromEnv = System.getenv("PRIME_APP_HASH")
    if (fromEnv != null && !fromEnv.trim().isEmpty()) {
        return fromEnv.trim()
    }
    def fromLocal = getProps("PRIME_APP_HASH")
    if (fromLocal != null && !fromLocal.toString().trim().isEmpty()) {
        return fromLocal.toString().trim()
    }
    return APP_HASH
}

def getProps(String propName) {
    def propsFile = rootProject.file('local.properties')
    if (propsFile.exists()) {
        def props = new Properties()
        props.load(new FileInputStream(propsFile))
        return props[propName]
    } else {
        return "";
    }
}
// apply plugin: 'com.google.gms.google-services'

task checkVisibility {
    doFirst {
        def isPrivateBuild = project.gradle.startParameter.taskNames.find {
            it.contains("HA_private") || it.contains("HA_hardcore") || it.contains("Debug") || it.contains("Release")
        }
        def isPublicAllowed = !project.hasProperty("IS_PRIVATE") || !project.property("IS_PRIVATE").toBoolean()
        if (!isPrivateBuild && !isPublicAllowed) {
            throw new GradleException("Building public version of private code!")
        }
    }
    doLast {
        if (project.gradle.startParameter.taskNames.find { it.contains("HA_public") }) {
            def privateBuild = file("${projectDir}_AppHockeyApp/afat/HA_private/Telegram-Beta.apk")
            if (privateBuild.exists()) {
                privateBuild.delete()
            }
        }
    }
}

preBuild.dependsOn checkVisibility

