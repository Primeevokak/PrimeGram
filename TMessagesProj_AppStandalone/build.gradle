apply plugin: 'com.android.application'
apply plugin: 'org.telegram.build-app-plugin'

repositories {
    mavenCentral()
    google()
    // PrimeGram: AliuHook comes in through TMessagesProj, but a transitive dependency is resolved
    // against the repositories of the module doing the resolving - so the app module needs to
    // know where it lives too.
    maven { url 'https://maven.aliucord.com/releases' }
}

configurations {
    compile.exclude module: 'support-v4'
}

configurations.all {
    exclude group: 'com.google.firebase', module: 'firebase-core'
    exclude group: 'androidx.recyclerview', module: 'recyclerview'
}

dependencies {
    implementation project(':TMessagesProj')
    implementation 'androidx.fragment:fragment:1.8.9'
    implementation 'androidx.core:core:1.16.0'
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.5'
    implementation files('../TMessagesProj/libs/libgsaverification-client.aar')
}

android {
    compileSdkVersion 36
    buildToolsVersion '36.0.0'

    defaultConfig.applicationId = APP_PACKAGE

    // srcDir(), not "srcDirs = [...]" - the assignment form replaces the whole source-dir
    // list rather than adding to it.
    sourceSets.main.jniLibs.srcDir('../TMessagesProj/jni/')

    lintOptions {
        disable 'MissingTranslation'
        disable 'ExtraTranslation'
        disable 'BlockedPrivateApi'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8

        coreLibraryDesugaringEnabled true
    }

    androidResources {
        noCompress += "pack"
        localeFilters += ["zz"]
    }

    signingConfigs {
        debug {
            storeFile file("../TMessagesProj/config/release.keystore")
            storePassword RELEASE_STORE_PASSWORD
            keyAlias RELEASE_KEY_ALIAS
            keyPassword RELEASE_KEY_PASSWORD
            v1SigningEnabled true
            v2SigningEnabled true
            enableV3Signing true
        }

        release {
            // Installed PrimeGram (thousands of users) is signed with upstream's public
            // release.keystore, and Android installs an update only when its signer matches - an
            // APK signed with PrimeGram's own key alone fails to update every existing install.
            // So the old key stays the default. The own key (PRIME_KEYSTORE_* from env/CI secrets or
            // the gitignored local.properties, keystore outside the repo) is used only on an explicit
            // PRIME_SIGN_WITH_OWN_KEY=true, meant for a migration via APK v3 key rotation (a lineage
            // signed by the old key), never as a plain switch.
            def primeKeystore = "true" == primeSecret("PRIME_SIGN_WITH_OWN_KEY") ? primeSecret("PRIME_KEYSTORE_FILE") : null
            if (primeKeystore) {
                storeFile file(primeKeystore)
                storePassword primeSecret("PRIME_KEYSTORE_PASSWORD")
                keyAlias primeSecret("PRIME_KEY_ALIAS")
                keyPassword primeSecret("PRIME_KEY_PASSWORD")
            } else {
                storeFile file("../TMessagesProj/config/release.keystore")
                storePassword RELEASE_STORE_PASSWORD
                keyAlias RELEASE_KEY_ALIAS
                keyPassword RELEASE_KEY_PASSWORD
            }
            // AGP drops the legacy v1 (JAR) signature by default once minSdkVersion >= 24, since
            // v2/v3 alone satisfy stock Android. Some OEM package installers (Huawei/EMUI in
            // particular) still expect v1 to be present and reject a v2/v3-only APK with a generic
            // parse error instead of a signature-specific one - forcing it back on costs nothing
            // and fixes installs on those.
            v1SigningEnabled true
            v2SigningEnabled true
            enableV3Signing true
        }
    }

    buildTypes {
        debug {
            debuggable true
            jniDebuggable true
            signingConfig signingConfigs.debug
            // applicationIdSuffix ".web"
            minifyEnabled false
            multiDexEnabled true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), '../TMessagesProj/proguard-rules.pro'
            ndk.debugSymbolLevel = 'FULL'
        }
        standalone {
            matchingFallbacks = ['release']
            debuggable false
            jniDebuggable false
            signingConfig signingConfigs.release
            // applicationIdSuffix ".web"
            minifyEnabled true
            multiDexEnabled true
            proguardFiles getDefaultProguardFile('proguard-android.txt'), '../TMessagesProj/proguard-rules.pro'
            ndk.debugSymbolLevel = 'FULL'
        }
        release {
            // false: a debuggable APK runs the whole app in ART's debug mode - the slow switch
            // interpreter instead of nterp, JIT code kept deoptimizable, CheckJNI on every native
            // call - which cost frames everywhere under load. It was once set true on the belief
            // that Play Protect trusts debuggable sideloads more; it does not. What it distrusts is
            // the public upstream signing key, now replaced by PrimeGram's own (signingConfigs).
            debuggable false
            jniDebuggable false
            signingConfig signingConfigs.release
            minifyEnabled true
            shrinkResources true
            multiDexEnabled true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), '../TMessagesProj/proguard-rules.pro'
            ndk.debugSymbolLevel = 'FULL'
        }
    }

    sourceSets.debug {
        manifest.srcFile '../TMessagesProj/config/release/AndroidManifest_standalone.xml'
    }
    sourceSets.standalone {
        manifest.srcFile '../TMessagesProj/config/release/AndroidManifest_standalone.xml'
    }
    sourceSets.release {
        manifest.srcFile '../TMessagesProj/config/release/AndroidManifest_standalone.xml'
    }

    flavorDimensions "minApi"

    productFlavors {
        afat {
            ndk {
                if (System.getenv("CI") != "true") {
                    abiFilters "arm64-v8a"
                }
            }
            ext {
                abiVersionCode = 9
            }
            sourceSets.standalone {
                manifest.srcFile '../TMessagesProj/config/release/AndroidManifest_standalone.xml'
            }
        }
    }

    defaultConfig.versionCode = Integer.parseInt(APP_VERSION_CODE)

//    applicationVariants.all { variant ->
//        variant.outputs.all { output ->
//            outputFileName = "PrimeGram.apk"
//            output.versionCodeOverride = defaultConfig.versionCode * 10 + variant.productFlavors.get(0).abiVersionCode
//        }
//    }

    variantFilter { variant ->
        def names = variant.flavors*.name
        if (variant.buildType.name != "release" && !names.contains("afat")) {
            setIgnore(true)
        }
    }

    defaultConfig {
        minSdkVersion 24
        targetSdkVersion 36
        versionName APP_VERSION_NAME
        ndkVersion "27.2.12479018"

        multiDexEnabled true

        vectorDrawables.generatedDensities = ['mdpi', 'hdpi', 'xhdpi', 'xxhdpi']

        externalNativeBuild {
            cmake {
                version '3.22.1'
                arguments '-DANDROID_STL=c++_static', '-DANDROID_PLATFORM=android-21' //, '-DANDROID_SUPPORT_FLEXIBLE_PAGE_SIZES=ON'
                targets 'tmessages.49'
            }
        }
    }

    splits {
        abi {
            enable System.getenv("CI") == "true"
            reset()
            include "armeabi-v7a", "arm64-v8a", "x86", "x86_64"
            universalApk false
        }
    }

    buildFeatures {
        buildConfig = true
    }
    namespace 'org.telegram.messenger.web'

    lintOptions {
        checkReleaseBuilds false
    }
}

apply plugin: 'com.google.gms.google-services'




// A build secret: the environment first (GitHub Actions secrets), then the gitignored
// local.properties at the repo root. Null when neither has it.
def primeSecret(String name) {
    def fromEnv = System.getenv(name)
    if (fromEnv != null && !fromEnv.trim().isEmpty()) {
        return fromEnv.trim()
    }
    def propsFile = rootProject.file('local.properties')
    if (propsFile.exists()) {
        def props = new Properties()
        propsFile.withInputStream { props.load(it) }
        def value = props.getProperty(name)
        if (value != null && !value.trim().isEmpty()) {
            return value.trim()
        }
    }
    return null
}
