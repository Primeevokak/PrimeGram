apply plugin: 'com.android.application'

repositories {
    mavenCentral()
    google()
    // PrimeGram: AliuHook comes in through TMessagesProj, but a transitive dependency is resolved
    // against the repositories of the module doing the resolving - so the app module needs to
    // know where it lives too.
    maven { url 'https://maven.aliucord.com/releases' }
}

configurations {
    compile.exclude module: 'support-v4'
}

configurations.all {
    exclude group: 'com.google.firebase', module: 'firebase-core'
    exclude group: 'androidx.recyclerview', module: 'recyclerview'
}

dependencies {
    implementation project(':TMessagesProj')
    implementation 'androidx.fragment:fragment:1.8.9'
    implementation 'androidx.core:core:1.16.0'
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.5'
    implementation files('../TMessagesProj/libs/libgsaverification-client.aar')

    // PrimeGram: the Flutter Gradle plugin's own libapp.so packaging (a custom Jar task's
    // output added as an "api" dependency on the :flutter project itself - see
    // FlutterPluginUtils.addApiDependencies in the Flutter SDK) was not propagating through
    // TMessagesProj (a library module) to reach this module's final APK - confirmed missing
    // via `unzip -l` even after a fully clean rebuild, while TMessagesProj/build.gradle's own
    // ':flutter' dependency (needed there for PrimeFlutterActivity/PrimeFlutterEngineHolder's
    // Java compile-time access to io.flutter.* classes) resolves fine on the compile
    // classpath. Depending on it directly here too - the actual APK-producing module, and
    // the one gradle.properties' flutter.hostAppProjectName names - is the standard,
    // best-tested add-to-app setup (app module depends on :flutter directly); TMessagesProj's
    // own dependency stays for the Java compile-time need.
    implementation project(':flutter')
}

android {
    compileSdkVersion 36
    buildToolsVersion '35.0.0'

    defaultConfig.applicationId = APP_PACKAGE

    // srcDir(), not "srcDirs = [...]" - the assignment form replaces the whole source-dir
    // list rather than adding to it.
    sourceSets.main.jniLibs.srcDir('../TMessagesProj/jni/')

    // PrimeGram: libapp.so - the AOT-compiled Dart code for PrimeFlutterActivity - was
    // missing from the final APK (confirmed via `unzip -l`, reproduced after a fully clean
    // rebuild, and with `implementation project(':flutter')` declared directly on this
    // module). The Flutter Gradle plugin packages it into a plain libs.jar and adds that as
    // an "api" dependency on the :flutter project itself (FlutterPluginUtils.
    // addApiDependencies in the Flutter SDK) - AGP's native-lib merge is documented to scan
    // AAR dependencies for embedded native libs, but a raw (non-AAR) jar reached via a
    // same-project "api" config apparently isn't picked up the same way in this multi-module
    // setup. Extracting it ourselves into a real jniLibs source directory - the exact
    // mechanism the line above already uses successfully - sidesteps the question of why
    // rather than chasing it further. AGP's jniLibs.srcDir convention is
    // "<srcDir>/<abi>/*.so" (no "lib/" prefix), which is why the Sync task below strips it.
    sourceSets.main.jniLibs.srcDir("$buildDir/flutterNativeLibs")

    lintOptions {
        disable 'MissingTranslation'
        disable 'ExtraTranslation'
        disable 'BlockedPrivateApi'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8

        coreLibraryDesugaringEnabled true
    }

    signingConfigs {
        debug {
            storeFile file("../TMessagesProj/config/release.keystore")
            storePassword RELEASE_STORE_PASSWORD
            keyAlias RELEASE_KEY_ALIAS
            keyPassword RELEASE_KEY_PASSWORD
            v1SigningEnabled true
            v2SigningEnabled true
            enableV3Signing true
        }

        release {
            storeFile file("../TMessagesProj/config/release.keystore")
            storePassword RELEASE_STORE_PASSWORD
            keyAlias RELEASE_KEY_ALIAS
            keyPassword RELEASE_KEY_PASSWORD
            // AGP drops the legacy v1 (JAR) signature by default once minSdkVersion >= 24, since
            // v2/v3 alone satisfy stock Android. Some OEM package installers (Huawei/EMUI in
            // particular) still expect v1 to be present and reject a v2/v3-only APK with a generic
            // parse error instead of a signature-specific one - forcing it back on costs nothing
            // and fixes installs on those.
            v1SigningEnabled true
            v2SigningEnabled true
            enableV3Signing true
        }
    }

    buildTypes {
        debug {
            debuggable true
            jniDebuggable true
            signingConfig signingConfigs.debug
            // applicationIdSuffix ".web"
            minifyEnabled false
            multiDexEnabled true
            proguardFiles getDefaultProguardFile('proguard-android.txt'), '../TMessagesProj/proguard-rules.pro', '../TMessagesProj/proguard-rules-beta.pro'
            ndk.debugSymbolLevel = 'FULL'
        }
        standalone {
            debuggable false
            jniDebuggable false
            signingConfig signingConfigs.release
            // applicationIdSuffix ".web"
            minifyEnabled true
            multiDexEnabled true
            proguardFiles getDefaultProguardFile('proguard-android.txt'), '../TMessagesProj/proguard-rules.pro'
            ndk.debugSymbolLevel = 'FULL'
        }
        release {
            // Deliberately true, not a leftover from debugging the session-drop issue: without a
            // Play Store signature, Google Play Protect flags a non-debuggable sideloaded APK much
            // more aggressively ("this app may be harmful"-style warnings on install/launch). This
            // is a real tradeoff (a debuggable release build can be attached to and its process
            // memory read), accepted knowingly because there is no Play Store signing key for this
            // build and there isn't expected to be one.
            debuggable true
            jniDebuggable false
            signingConfig signingConfigs.release
            minifyEnabled true
            multiDexEnabled true
            proguardFiles getDefaultProguardFile('proguard-android.txt'), '../TMessagesProj/proguard-rules.pro'
            ndk.debugSymbolLevel = 'FULL'
        }
    }

    sourceSets.debug {
        manifest.srcFile '../TMessagesProj/config/release/AndroidManifest_standalone.xml'
    }
    sourceSets.standalone {
        manifest.srcFile '../TMessagesProj/config/release/AndroidManifest_standalone.xml'
    }
    sourceSets.release {
        manifest.srcFile '../TMessagesProj/config/release/AndroidManifest_standalone.xml'
    }

    flavorDimensions "minApi"

    productFlavors {
        afat {
            ndk {
                if (System.getenv("CI") != "true") {
                    abiFilters "arm64-v8a"
                }
            }
            ext {
                abiVersionCode = 9
            }
            sourceSets.standalone {
                manifest.srcFile '../TMessagesProj/config/release/AndroidManifest_standalone.xml'
            }
        }
    }

    defaultConfig.versionCode = Integer.parseInt(APP_VERSION_CODE)

//    applicationVariants.all { variant ->
//        variant.outputs.all { output ->
//            outputFileName = "PrimeGram.apk"
//            output.versionCodeOverride = defaultConfig.versionCode * 10 + variant.productFlavors.get(0).abiVersionCode
//        }
//    }

    variantFilter { variant ->
        def names = variant.flavors*.name
        if (variant.buildType.name != "release" && !names.contains("afat")) {
            setIgnore(true)
        }
    }

    defaultConfig {
        minSdkVersion 24
        targetSdkVersion 35
        versionName APP_VERSION_NAME
        ndkVersion "27.2.12479018"

        multiDexEnabled true

        vectorDrawables.generatedDensities = ['mdpi', 'hdpi', 'xhdpi', 'xxhdpi']

        externalNativeBuild {
            cmake {
                version '3.10.2'
                arguments '-DANDROID_STL=c++_static', '-DANDROID_PLATFORM=android-21' //, '-DANDROID_SUPPORT_FLEXIBLE_PAGE_SIZES=ON'
            }
        }
    }

    splits {
        abi {
            enable System.getenv("CI") == "true"
            reset()
            include "armeabi-v7a", "arm64-v8a", "x86", "x86_64"
            universalApk false
        }
    }

    buildFeatures {
        buildConfig = true
    }
    namespace 'org.telegram.messenger.web'

    lintOptions {
        checkReleaseBuilds false
    }
}

apply plugin: 'com.google.gms.google-services'

// PrimeGram: see the doc comment on sourceSets.main.jniLibs.srcDir("$buildDir/
// flutterNativeLibs") above - unpacks libapp.so (and its armeabi-v7a/x86_64 siblings) out of
// the Flutter Gradle plugin's own libs.jar into the plain per-ABI directory layout AGP's
// jniLibs source sets expect, since depending on ':flutter' directly wasn't enough to get
// AGP's native-lib merge to pick it up on its own.
//
// Hardcoded to the "release" variant's libs.jar - this app currently only exercises that
// build type for real testing (see the "standalone"/HA_* build types' own matchingFallbacks
// in TMessagesProj/build.gradle, all pointed at :flutter's "release" too), and a debug build
// picking up the release Dart AOT snapshot is a harmless, known tradeoff (no debug build of
// the Flutter module is wired up at all yet) rather than a silent breakage.
tasks.register('extractFlutterNativeLibs', Sync) {
    def libsJar = file("$rootDir/prime_flutter_module/.android/Flutter/build/intermediates/flutter/release/libs.jar")
    dependsOn ':flutter:packJniLibsflutterBuildRelease'
    onlyIf { libsJar.exists() }
    from({ zipTree(libsJar) }) {
        include 'lib/**/*.so'
        eachFile { details ->
            // "lib/arm64-v8a/libapp.so" -> "arm64-v8a/libapp.so"
            details.path = details.path.replaceFirst('^lib/', '')
        }
        includeEmptyDirs = false
    }
    into "$buildDir/flutterNativeLibs"
}
tasks.named('preBuild').configure { dependsOn 'extractFlutterNativeLibs' }


